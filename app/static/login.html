<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0a10">
  <title>DayScore</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i></div>
  <div class="login-page">
    <div class="card login-card">
      <div class="brand"><img src="/static/icon.svg" alt="" width="34" height="34"> <span class="app-name">DayScore</span></div>
      <p id="intro">Your private productivity journal</p>

      <!-- step 1: password (or create one on first visit) -->
      <form id="pw-step" hidden>
        <label class="setup-code" hidden>
          <input name="setup_code" placeholder="Setup code (XXXX-XXXX)" autocomplete="off" spellcheck="false" autocapitalize="characters">
          <span class="hint">It's in the server logs: <code>docker compose logs dayscore</code></span>
        </label>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <input type="password" name="confirm" placeholder="Repeat password" autocomplete="new-password" hidden>
        <button class="btn" type="submit">Log in</button>
      </form>

      <!-- step 2: second factor -->
      <div id="mfa-step" hidden>
        <form id="totp-step" hidden>
          <input name="code" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required>
          <button class="btn" type="submit">Verify</button>
        </form>
        <form id="recovery-step" hidden>
          <input name="code" placeholder="Recovery code (xxxx-xxxx)" autocomplete="off" spellcheck="false" required>
          <button class="btn" type="submit">Use recovery code</button>
        </form>
        <button class="linkish" type="button" id="use-recovery">Use a recovery code instead</button>
      </div>

      <!-- first run: restore from a backup instead of starting fresh -->
      <button class="linkish" type="button" id="restore-link" hidden>Restore from a backup instead</button>
      <form id="restore-step" hidden>
        <input name="setup_code" placeholder="Setup code (from the server logs)" autocomplete="off" spellcheck="false" required>
        <input type="file" name="file" required>
        <input type="password" name="password" placeholder="Backup password" autocomplete="off">
        <button class="btn" type="submit">Check backup</button>
      </form>
      <div id="restore-preview" hidden></div>

      <div class="error" id="error" hidden></div>
    </div>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
