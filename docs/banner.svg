<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="DayScore – your private, AI-scored productivity journal">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 20) scale(620)">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 380) scale(640)">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="#0c0a10"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowB)"/>

  <!-- logo -->
  <g transform="translate(120 104)">
    <rect width="120" height="120" rx="30" fill="url(#brand)"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="13"/>
    <path d="M60 26a34 34 0 1 1-32.3 44.6" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- name + tagline -->
  <text x="280" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="url(#title)" letter-spacing="-2">DayScore</text>
  <text x="283" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" fill="#c3bfcc">Your private, AI-scored productivity journal</text>

  <!-- feature chips -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e9e5f2">
    <rect x="283" y="252" width="158" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="362" y="277" text-anchor="middle">Score 0 – 100</text>
    <rect x="453" y="252" width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="518" y="277" text-anchor="middle">Telegram</text>
    <rect x="595" y="252" width="116" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="653" y="277" text-anchor="middle">Todoist</text>
    <rect x="723" y="252" width="146" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="796" y="277" text-anchor="middle">Self-hosted</text>
  </g>

  <!-- score ring -->
  <g transform="translate(1030 180)">
    <circle r="92" fill="none" stroke="#2e1065" stroke-width="16"/>
    <circle r="92" fill="none" stroke="url(#brand)" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="578" stroke-dashoffset="81" transform="rotate(-90)"/>
    <text y="18" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" fill="#ffffff">86</text>
    <text y="50" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#b3adbd">of 100</text>
  </g>
</svg>
